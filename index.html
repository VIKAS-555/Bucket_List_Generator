<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suggest a New Goal — Bucket List Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="suggest-card">
    <h1 class="suggest-title">Suggest a New Goal</h1>
    <p class="suggest-subtitle">Know an extraordinary challenge, destination, or book? Leave your suggestion below!</p>

    <form class="suggest-form" action="#suggestion-box" method="get">
      <div class="form-row">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" placeholder="e.g. Alex" required autocomplete="name">
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" name="category" required>
            <option value="travel" selected>Travel &amp; Adventure</option>
            <option value="learning">Learning &amp; Career</option>
            <option value="health">Health &amp; Fitness</option>
            <option value="experiences">Experiences</option>
            <option value="books">Books &amp; Culture</option>
          </select>
        </div>
      </div>

      <div class="form-group full-width">
        <label for="details">Goal Title &amp; Details</label>
        <textarea id="details" name="details" placeholder="Describe the adventure or milestone..." required></textarea>
      </div>

      <button type="submit" class="submit-btn">Add to Suggestion Box</button>
    </form>
  </main>

  <hr class="footer-divider" id="suggestion-box">
  <footer class="site-footer">
    <p>• Built with pure HTML5 &amp; CSS3 • No JavaScript •</p>
  </footer>
</body>
</html>
